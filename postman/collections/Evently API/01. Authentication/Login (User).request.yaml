$kind: http-request
description: Oddiy foydalanuvchi sifatida tizimga kirish. Access va Refresh tokenlarni avtomatik `{{accessToken}}` ga saqlaydi.
url: "{{baseUrl}}/api/v1/auth/login/"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "user@example.com",
      "password": "StrongPass123!"
    }
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 200) {
          var jsonData = pm.response.json();
          if (jsonData.access) {
              pm.environment.set("accessToken", jsonData.access);
          }
          if (jsonData.refresh) {
              pm.environment.set("refreshToken", jsonData.refresh);
          }
      }
    language: text/javascript
order: 2000
