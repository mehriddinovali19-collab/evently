$kind: http-request
description: Refresh token orqali yangi access token olish.
url: "{{baseUrl}}/api/v1/auth/token/refresh/"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "refresh": "{{refreshToken}}"
    }
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 200) {
          var jsonData = pm.response.json();
          if (jsonData.access) {
              pm.environment.set("accessToken", jsonData.access);
          }
      }
    language: text/javascript
order: 4000
