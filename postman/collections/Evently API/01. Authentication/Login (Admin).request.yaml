$kind: http-request
description: Admin foydalanuvchi sifatida tizimga kirish. Access tokenni `{{adminAccessToken}}` ga saqlaydi.
url: "{{baseUrl}}/api/v1/auth/login/"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "admin@example.com",
      "password": "AdminPass123!"
    }
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 200) {
          var jsonData = pm.response.json();
          if (jsonData.access) {
              pm.environment.set("adminAccessToken", jsonData.access);
          }
          if (jsonData.refresh) {
              pm.environment.set("adminRefreshToken", jsonData.refresh);
          }
      }
    language: text/javascript
order: 3000
