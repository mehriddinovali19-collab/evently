$kind: http-request
description: Tizimga kirgan foydalanuvchi tadbirga ro'yxatdan o'tadi. Joy qolmagan bo'lsa yoki allaqachon yozilgan bo'lsa 400 Bad Request qaytadi.
url: "{{baseUrl}}/api/v1/events/{{eventId}}/register/"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 201) {
          var jsonData = pm.response.json();
          if (jsonData.id) {
              pm.environment.set("registrationId", jsonData.id);
          }
      }
    language: text/javascript
order: 1000
