$kind: http-request
description: Telegram bot foydalanuvchining `/start <token>` buyrug'ini qabul qilgandan so'ng backendga yuboradigan so'rovi.
url: "{{baseUrl}}/api/v1/telegram/confirm/"
method: POST
headers:
  - key: Content-Type
    value: application/json
  - key: X-Bot-Secret
    value: "{{botApiSecret}}"
    description: Faqat Telegram bot bilishi kerak bo'lgan maxfiy ichki kalit
body:
  type: text
  content: |-
    {
      "token": "{{telegramLinkToken}}",
      "chat_id": 123456789
    }
order: 2000
