$kind: http-request
description: Foydalanuvchi saytda Telegramni ulash tugmasini bosganda bir martalik havola generatsiya qilinadi. Havoladagi token avtomatik `{{telegramLinkToken}}` ga olinadi.
url: "{{baseUrl}}/api/v1/telegram/link/"
method: POST
auth:
  type: bearer
  credentials:
    token: "{{accessToken}}"
scripts:
  - type: afterResponse
    code: |-
      if (pm.response.code === 200) {
          var jsonData = pm.response.json();
          if (jsonData.link) {
              var match = jsonData.link.match(/start=([^&]+)/);
              if (match && match[1]) {
                  pm.environment.set("telegramLinkToken", match[1]);
              }
          }
      }
    language: text/javascript
order: 1000
