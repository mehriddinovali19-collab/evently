$kind: http-request
description: Admin tomonidan tadbir ma'lumotlarini qisman tahrirlash.
url: "{{baseUrl}}/api/v1/events/{{eventId}}/"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "capacity": 35,
      "location": "IT Park, 4-qavat, Katta majlislar zali"
    }
auth:
  type: bearer
  credentials:
    token: "{{adminAccessToken}}"
order: 4000
